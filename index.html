/* ---------------- helpers ---------------- */
const pad = n => String(n).padStart(2, "0");
const fmtDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey = () => fmtDate(new Date());
const dayLabelHi = key => new Date(key + "T00:00:00").toLocaleDateString("hi-IN", { weekday: "short" });
const monthKeyOf = key => key.slice(0, 7);

const defaultData = () => ({
  mantras: [
    { id: "om-namah-shivaya", name: "ॐ नमः शिवाय", sub: "Om Namah Shivaya" },
    { id: "hare-krishna", name: "हरे कृष्ण", sub: "Hare Krishna" },

function sumByDate(counts) {
  const out = {};
  Object.values(counts).forEach(m => {
    Object.entries(m.byDate || {}).forEach(([k,v]) => { out[k] = (out[k]||0) + v; });
  });
  return out;
}
function calcStreaks(byDate) {
  const dates = Object.keys(byDate).filter(k => byDate[k] > 0).sort();
  if (!dates.length) return { current: 0, best: 0 };
  let best = 1, run = 1;
  for (let i=1;i<dates.length;i++) {
    const prev = new Date(dates[i-1]+"T00:00:00");
    const cur = new Date(dates[i]+"T00:00:00");
    const diff = Math.round((cur-prev)/86400000);
    run = diff === 1 ? run+1 : 1;
    if (run > best) best = run;
  }
  let current = 0;
  let d = new Date();
  let key = fmtDate(d);
  if (!byDate[key]) d.setDate(d.getDate()-1);
  while (byDate[fmtDate(d)]) { current++; d.setDate(d.getDate()-1); }
  return { current, best };
}
function last7Days() {
  const arr = []; const d = new Date();
  for (let i=6;i>=0;i--) { const dd = new Date(d); dd.setDate(d.getDate()-i); arr.push(fmtDate(dd)); }
  return arr;
}
function resizeImage(file, maxDim=800, quality=0.68) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round(height*maxDim/width); width = maxDim; }
        else if (height > maxDim) { width = Math.round(width*maxDim/height); height = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------------- Firestore load/save ---------------- */
let saveTimer = null;
function scheduleSave() {
  if (!currentUser) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    db.collection("users").doc(currentUser.uid).set({
      mantras: state.mantras, selectedId: state.selectedId, counts: state.counts,
      backgroundId: state.backgroundId, songs: state.songs, updatedAt: Date.now(),
    }, { merge: true }).catch(e => console.error("save failed", e));
  }, 500);
}
async function loadUserData(uid_) {
  const doc = await db.collection("users").doc(uid_).get();
  if (doc.exists) {
    const d = doc.data();
    state = { ...defaultData(), ...d };
  } else {
    state = defaultData();
    await db.collection("users").doc(uid_).set({ ...state, updatedAt: Date.now() });
  }
  const imgSnap = await db.collection("users").doc(uid_).collection("images").orderBy("createdAt").get();
  images = imgSnap.docs.map(d => ({ id: d.id, ...d.data() }));
}

/* ---------------- auth ---------------- */
let authMode = "signin";
function showAuthError(msg) {
  const el = document.getElementById("authError");
  el.textContent = msg; el.classList.remove("hidden");
}
function hideAuthError() { document.getElementById("authError").classList.add("hidden"); }

function rewireAuthToggle() {
  document.getElementById("authToggleLink").onclick = () => {
    authMode = authMode === "signin" ? "signup" : "signin";
    document.getElementById("authSubmitBtn").textContent = authMode === "signin" ? "साइन इन करें" : "खाता बनाएं";
    document.getElementById("authToggleWrap").innerHTML = authMode === "signin"
      ? 'नया यूज़र हैं? <a id="authToggleLink">खाता बनाएं</a>'
      : 'पहले से खाता है? <a id="authToggleLink">साइन इन करें</a>';
    rewireAuthToggle();
  };
}
rewireAuthToggle();

document.getElementById("authSubmitBtn").onclick = async () => {
  hideAuthError();
  const email = document.getElementById("authEmail").value.trim();
  const pass = document.getElementById("authPassword").value;
  if (!email || !pass) { showAuthError("ईमेल और पासवर्ड दोनों भरें"); return; }
  try {
    if (authMode === "signin") await auth.signInWithEmailAndPassword(email, pass);
    else await auth.createUserWithEmailAndPassword(email, pass);
  } catch (e) {
    showAuthError(friendlyAuthError(e));
  }
};
document.getElementById("googleSignInBtn").onclick = async () => {
  hideAuthError();
  const provider = new firebase.auth.GoogleAuthProvider();
  try {
    await auth.signInWithPopup(provider);
  } catch (e) {
    try { await auth.signInWithRedirect(provider); }
    catch (e2) { showAuthError(friendlyAuthError(e2)); }
  }
};
function friendlyAuthError(e) {
  const code = e.code || "";
  if (code.includes("wrong-password") || code.includes("invalid-credential")) return "पासवर्ड गलत है";
  if (code.includes("user-not-found")) return "खाता नहीं मिला, नया खाता बनाएं";
  if (code.includes("email-already-in-use")) return "यह ईमेल पहले से इस्तेमाल हो रहा है, साइन इन करें";
  if (code.includes("weak-password")) return "पासवर्ड कम से कम 6 अक्षर का हो";
  if (code.includes("invalid-email")) return "ईमेल सही नहीं है";
  return "कुछ गलत हो गया, दोबारा कोशिश करें";
}

auth.onAuthStateChanged(async (user) => {
  if (user) {
    currentUser = user;
    document.getElementById("authScreen").classList.add("hidden");
    document.getElementById("mainHeader").classList.remove("hidden");
    document.getElementById("mainArea").classList.remove("hidden");
    document.getElementById("mainNav").classList.remove("hidden");
    const avatarBtn = document.getElementById("avatarBtn");
    if (user.photoURL) avatarBtn.innerHTML = `<img src="${user.photoURL}" />`;
    else avatarBtn.textContent = (user.email || "?")[0].toUpperCase();
    await loadUserData(user.uid);
    render();
  } else {
    currentUser = null;
    document.getElementById("authScreen").classList.remove("hidden");
    document.getElementById("mainHeader").classList.add("hidden");
    document.getElementById("mainArea").classList.add("hidden");
    document.getElementById("mainNav").classList.add("hidden");
  }
});

document.getElementById("avatarBtn").onclick = () => {
  const u = currentUser;
  if (!u) return;
  const av = document.getElementById("signOutAvatar");
  av.innerHTML = u.photoURL ? `<img src="${u.photoURL}"/>` : (u.email||"?")[0].toUpperCase();
  document.getElementById("signOutEmail").textContent = u.email || "";
  document.getElementById("signOutModal").classList.remove("hidden");
};
function closeSignOutModal() { document.getElementById("signOutModal").classList.add("hidden"); }
document.getElementById("signOutModal").addEventListener("click", closeSignOutModal);
document.getElementById("signOutBtn").onclick = () => auth.signOut();

/* ---------------- render ---------------- */
let currentTab = "jaap";
let playingId = null;
let addSongOpen = false;

function render() {
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === currentTab));
  const main = document.getElementById("mainArea");
  if (currentTab === "jaap") main.innerHTML = renderJaap();
  else if (currentTab === "stats") main.innerHTML = renderStats();
  else if (currentTab === "gallery") main.innerHTML = renderGallery();
  else if (currentTab === "songs") main.innerHTML = renderSongs();

  const combined = sumByDate(state.counts);
  document.getElementById("streakVal").textContent = calcStreaks(combined).current;

  const bgLayer = document.getElementById("bgImageLayer");
  const bgImg = images.find(i => i.id === state.backgroundId);
  if (bgImg) { bgLayer.style.backgroundImage = `url(${bgImg.dataUrl})`; bgLayer.classList.remove("hidden"); }
  else bgLayer.classList.add("hidden");

  attachHandlers();
}

function renderJaap() {
  const sel = state.mantras.find(m => m.id === state.selectedId) || state.mantras[0];
  const cnt = state.counts[state.selectedId] || { total: 0, byDate: {} };
  const today = cnt.byDate?.[todayKey()] || 0;
  const progress = (cnt.total % 108) / 108;
  const rounds = Math.floor(cnt.total / 108);
  const beadCount = 36, filled = Math.round(progress*beadCount), size=236, r=size/2-14;
  let beads = "";
  for (let i=0;i<beadCount;i++) {
    const angle = (i/beadCount)*Math.PI*2 - Math.PI/2;
    const x = size/2 + r*Math.cos(angle), y = size/2 + r*Math.sin(angle);
    const isSumeru = i===0, on = i<filled;
    beads += `<circle cx="${x}" cy="${y}" r="${isSumeru?6.5:4.2}" fill="${isSumeru?'#E8794A':on?'#D4A94A':'rgba(243,231,211,0.16)'}"/>`;
  }
  const chips = state.mantras.map(m => `<button class="chip ${m.id===state.selectedId?'active':''}" data-mid="${m.id}">${m.name}</button>`).join("");
  return `
    <div class="jaap-wrap">
      <div class="chip-row">${chips}<button class="chip-add" id="openManageBtn">+</button></div>
      <div class="mala-progress-label">माला ${rounds} पूर्ण · ${Math.round(progress*108)}/108</div>
      <div class="mala-ring-wrap" id="tapArea">
        <svg class="mala-svg" width="${size}" height="${size}">${beads}</svg>
        <div class="mala-btn" id="malaBtn">
          <div class="mala-mantra">${sel?.name || ""}</div>
          <div class="mala-count">${today}</div>
          <div class="mala-hint">आज · TAP करें</div>
        </div>
      </div>
      <div class="stat-row">
        <div class="stat-pill"><div class="val">${cnt.total}</div><div class="lbl">कुल जाप</div></div>
        <div class="stat-pill"><div class="val">${rounds}</div><div class="lbl">माला</div></div>
      </div>
    </div>`;
}

function renderStats() {
  const combined = sumByDate(state.counts);
  const today = combined[todayKey()] || 0;
  const week = last7Days().reduce((s,k) => s + (combined[k]||0), 0);
  const mk = monthKeyOf(todayKey());
  const month = Object.entries(combined).filter(([k]) => monthKeyOf(k)===mk).reduce((s,[,v]) => s+v, 0);
  const allTime = Object.values(state.counts).reduce((s,m) => s+m.total, 0);
  const streaks = calcStreaks(combined);
  const days = last7Days();
  const maxDay = Math.max(1, ...days.map(k => combined[k]||0));
  const bars = days.map(k => {
    const v = combined[k]||0;
    const h = Math.max(3, Math.round((v/maxDay)*110));
    return `<div class="bar-col"><div class="bar-fill" style="height:${h}px"></div><div class="bar-day">${dayLabelHi(k)}</div></div>`;
  }).join("");
  const mantraCards = state.mantras.map(m => {
    const t = state.counts[m.id]?.total || 0;
    const pct = allTime ? Math.round((t/allTime)*100) : 0;
    return `<div class="mantra-stat-card">
      <div class="mantra-stat-top"><span class="mantra-stat-name">${m.name}</span><span class="mantra-stat-total">${t}</span></div>
      <div class="mantra-stat-bar-bg"><div class="mantra-stat-bar-fg" style="width:${pct}%"></div></div>
    </div>`;
  }).join("");
  return `
    <div class="stats-wrap">
      <div class="mini-grid">
        <div class="mini-card"><div class="val">${today}</div><div class="lbl">आज</div></div>
        <div class="mini-card"><div class="val">${week}</div><div class="lbl">यह सप्ताह</div></div>
        <div class="mini-card"><div class="val">${month}</div><div class="lbl">यह महीना</div></div>
        <div class="mini-card"><div class="val">${allTime}</div><div class="lbl">सर्वकालिक</div></div>
      </div>
      <div class="streak-cards">
        <div class="streak-card" style="background:rgba(107,143,90,.12);border:1px solid rgba(107,143,90,.3);">🔥<div><div class="big">${streaks.current} दिन</div><div class="small">वर्तमान लकीर</div></div></div>
        <div class="streak-card" style="background:rgba(212,169,74,.1);border:1px solid rgba(212,169,74,.28);">✨<div><div class="big">${streaks.best} दिन</div><div class="small">सर्वश्रेष्ठ लकीर</div></div></div>
      </div>
      <div class="section-title">पिछले 7 दिन</div>
      <div class="bar-chart-box">${bars}</div>
      <div class="section-title">नाम अनुसार</div>
      ${mantraCards}
    </div>`;
}

function renderGallery() {
  const hasImgs = images.length > 0;
  const grid = images.map(img => `
    <div class="gallery-item ${img.id===state.backgroundId?'selected':''}" data-imgid="${img.id}">
      <img src="${img.dataUrl}" />
      ${img.id===state.backgroundId ? '<div class="gallery-check">✓</div>' : ''}
      <button class="gallery-del" data-delimg="${img.id}">✕</button>
    </div>`).join("");
  return `
    <div class="gv-wrap">
      <div class="gv-top">
        <div class="gv-hint">${hasImgs ? "टैप कर के बैकग्राउंड चुनें" : "अपनी भगवान की तस्वीरें जोड़ें"}</div>
        <button class="btn-pill" id="addImageBtn">＋ जोड़ें</button>
      </div>
      ${hasImgs ? `<div class="gallery-grid">${grid}</div>` : `<div class="empty-box">🖼️<br/>अभी कोई तस्वीर नहीं है</div>`}
    </div>`;
}

function renderSongs() {
  const hasSongs = state.songs.length > 0;
  const list = state.songs.map(s => `
    <div class="song-item">
      <button class="song-play ${playingId===s.id?'playing':''}" data-playid="${s.id}">${playingId===s.id?'⏸':'▶'}</button>
      <div style="flex:1;min-width:0;">
        <div class="song-title">${s.title}</div>
        <div class="song-sub">${playingId===s.id?'🔊 बज रहा है':(s.local?'इस सेशन के लिए':'सेव किया गया')}</div>
      </div>
      <button class="icon-btn" data-delsong="${s.id}">🗑</button>
    </div>`).join("");
  return `
    <div class="sv-wrap">
      <div class="sv-top">
        <div class="gv-hint">भजन / मंत्र संगीत</div>
        <button class="btn-pill" id="toggleAddSongBtn">＋ जोड़ें</button>
      </div>
      ${addSongOpen ? `
      <div class="add-song-box">
        <div class="add-song-label">🔗 URL से जोड़ें (सेव रहेगा)</div>
        <input id="songTitleInput" class="field" placeholder="भजन का नाम" />
        <input id="songUrlInput" class="field" placeholder="ऑडियो लिंक (https://...)" />
        <button class="btn-full" id="submitSongBtn">जोड़ें</button>
        <div class="divider-row"><div class="line"></div><span>या</span><div class="line"></div></div>
        <label class="upload-dashed" for="audioFileInput">⬆ डिवाइस से फ़ाइल चुनें (सिर्फ़ इस सेशन के लिए)</label>
      </div>` : ""}
      ${hasSongs ? list : `<div class="empty-box">🎵<br/>अभी कोई भजन नहीं जोड़ा गया</div>`}
    </div>`;
}

/* ---------------- actions ---------------- */
function increment() {
  const cur = state.counts[state.selectedId] || { total: 0, byDate: {} };
  const t = todayKey();
  cur.total += 1;
  cur.byDate[t] = (cur.byDate[t]||0) + 1;
  state.counts[state.selectedId] = cur;
  scheduleSave();
  if (navigator.vibrate) navigator.vibrate(12);
  const btn = document.getElementById("malaBtn");
  if (btn) { btn.classList.add("pulse"); setTimeout(()=>btn.classList.remove("pulse"),150); }
  render();
}

function openManage() {
  document.getElementById("manageModal").classList.remove("hidden");
  renderMantraList();
}
function closeManage() { document.getElementById("manageModal").classList.add("hidden"); }
function renderMantraList() {
  const el = document.getElementById("mantraList");
  el.innerHTML = state.mantras.map(m => `
    <div class="mantra-row">
      <div><div class="name">${m.name}</div>${m.sub?`<div class="sub">${m.sub}</div>`:""}</div>
      ${state.mantras.length>1 ? `<button class="icon-btn" data-delmantra="${m.id}">🗑</button>` : ""}
    </div>`).join("");
  el.querySelectorAll("[data-delmantra]").forEach(b => b.onclick = () => {
    const id = b.dataset.delmantra;
    if (state.mantras.length<=1) return;
    state.mantras = state.mantras.filter(m => m.id!==id);
    delete state.counts[id];
    if (state.selectedId===id) state.selectedId = state.mantras[0].id;
    scheduleSave(); renderMantraList(); render();
  });
}
function addMantra() {
  const hi = document.getElementById("newMantraHi").value.trim();
  const en = document.getElementById("newMantraEn").value.trim();
  if (!hi) return;
  const id = uid();
  state.mantras.push({ id, name: hi, sub: en });
  state.selectedId = id;
  scheduleSave();
  document.getElementById("newMantraHi").value = "";
  document.getElementById("newMantraEn").value = "";
  renderMantraList(); render();
}

async function handleImageFiles(files) {
  if (!currentUser) return;
  for (const f of files) {
    try {
      const dataUrl = await resizeImage(f);
      const docRef = await db.collection("users").doc(currentUser.uid).collection("images").add({
        name: f.name, dataUrl, createdAt: Date.now(),
      });
      images.push({ id: docRef.id, name: f.name, dataUrl });
    } catch (e) { console.error(e); }
  }
  render();
}
async function deleteImage(id) {
  images = images.filter(i => i.id!==id);
  if (state.backgroundId===id) { state.backgroundId = null; scheduleSave(); }
  render();
  if (currentUser) {
    try { await db.collection("users").doc(currentUser.uid).collection("images").doc(id).delete(); }
    catch (e) { console.error(e); }
  }
}

function addSongFromUrl() {
  const title = document.getElementById("songTitleInput").value.trim();
  const url = document.getElementById("songUrlInput").value.trim();
  if (!title || !url) return;
  state.songs.push({ id: uid(), title, url, local: false });
  addSongOpen = false;
  scheduleSave(); render();
}
function addLocalSong(file) {
  const url = URL.createObjectURL(file);
  state.songs.push({ id: uid(), title: file.name.replace(/\.[^.]+$/, ""), url, local: true });
  render();
}
function deleteSongLocal(id) {
  if (playingId===id) { document.getElementById("audioPlayer").pause(); playingId=null; }
  state.songs = state.songs.filter(s => s.id!==id);
  scheduleSave(); render();
}
function togglePlay(song) {
  const audio = document.getElementById("audioPlayer");
  if (playingId === song.id) { audio.pause(); playingId = null; }
  else { audio.src = song.url; audio.play().catch(()=>{}); playingId = song.id; }
  render();
}

/* ---------------- event wiring ---------------- */
function attachHandlers() {
  document.querySelectorAll(".chip[data-mid]").forEach(c => c.onclick = () => { state.selectedId = c.dataset.mid; scheduleSave(); render(); });
  const openManageBtn = document.getElementById("openManageBtn");
  if (openManageBtn) openManageBtn.onclick = openManage;
  const tapArea = document.getElementById("tapArea");
  if (tapArea) tapArea.onclick = increment;

  const addImageBtn = document.getElementById("addImageBtn");
  if (addImageBtn) addImageBtn.onclick = () => document.getElementById("imageFileInput").click();
  document.querySelectorAll("[data-imgid]").forEach(el => el.onclick = (e) => {
    if (e.target.closest("[data-delimg]")) return;
    const id = el.dataset.imgid;
    state.backgroundId = state.backgroundId===id ? null : id;
    scheduleSave(); render();
  });
  document.querySelectorAll("[data-delimg]").forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    deleteImage(b.dataset.delimg);
  });

  const toggleAddSongBtn = document.getElementById("toggleAddSongBtn");
  if (toggleAddSongBtn) toggleAddSongBtn.onclick = () => { addSongOpen = !addSongOpen; render(); };
  const submitSongBtn = document.getElementById("submitSongBtn");
  if (submitSongBtn) submitSongBtn.onclick = addSongFromUrl;
  document.querySelectorAll("[data-playid]").forEach(b => b.onclick = () => {
    const song = state.songs.find(s => s.id===b.dataset.playid);
    if (song) togglePlay(song);
  });
  document.querySelectorAll("[data-delsong]").forEach(b => b.onclick = () => deleteSongLocal(b.dataset.delsong));
}

document.querySelectorAll(".tab-btn").forEach(b => b.onclick = () => { currentTab = b.dataset.tab; render(); });
document.getElementById("imageFileInput").addEventListener("change", e => { handleImageFiles(Array.from(e.target.files||[])); e.target.value=""; });
document.getElementById("audioFileInput").addEventListener("change", e => { const f=e.target.files?.[0]; if(f) addLocalSong(f); e.target.value=""; });
document.getElementById("audioPlayer").addEventListener("ended", () => { playingId=null; render(); });
document.getElementById("manageModal").addEventListener("click", closeManage);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(e => console.log("SW failed", e));
  });
}
</script>
